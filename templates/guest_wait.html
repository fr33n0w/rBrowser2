<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rBrowser - guest</title>
<link rel="icon" type="image/png" href="/logo-small.png">
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
 .box{box-sizing:border-box;width:min(360px,calc(100vw - 32px));padding:24px;border:1px solid #30363d;border-radius:10px;background:#161b22}
 h1{font-size:16px;margin:0 0 10px;font-weight:600}
 p{font-size:13px;color:#8b949e;margin:0 0 12px}
 .name{color:#e6edf3;font-family:ui-monospace,Consolas,monospace}
 .bar{height:6px;border-radius:3px;background:#21262d;overflow:hidden;margin:4px 0 8px}
 .bar i{display:block;height:100%;width:0;background:#58a6ff;transition:width .4s}
 .info{font-size:12px;color:#8b949e;min-height:1.2em}
 .err{color:#f85149;font-size:13px;margin-top:10px}
 button{margin-top:12px;width:100%;padding:9px;border:1px solid #30363d;border-radius:6px;background:#21262d;
        color:#e6edf3;font-size:14px;cursor:pointer}
 [hidden]{display:none}
 .logo{position:relative;width:112px;height:112px;margin:0 auto 18px}
 .logo img{position:absolute;inset:14px;width:84px;height:84px}
 .logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid #21262d}
 .logo::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;
  background:conic-gradient(from 0deg,transparent 0 55%,rgba(88,166,255,.35) 75%,#58a6ff 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  animation:gw-spin 1.1s linear infinite}
 .logo.done::before{animation:none;background:#3fb950}
 @keyframes gw-spin{to{transform:rotate(360deg)}}
 @media (prefers-reduced-motion:reduce){.logo::before{animation-duration:3s}}
 h1{text-align:center}
 a{color:#8b949e;font-size:12px}
</style></head><body>
<div class="box">
 <div class="logo" id="gw-logo"><img src="/logo.png" alt="rBrowser"></div>
 <h1>Guest identity generation in progress, please wait...</h1>
 <p>Your guest name: <span class="name" id="gw-name">...</span></p>
 <div class="bar"><i id="gw-bar"></i></div>
 <div class="info" id="gw-info"></div>
 <div class="err" id="gw-err" hidden></div>
 <button type="button" id="gw-skip" hidden>Continue without LXMF</button>
 <p style="margin:14px 0 0;text-align:right"><a href="/logout">log out</a></p>
</div>
<script>
(function () {
    'use strict';
    const $ = id => document.getElementById(id);
    let workers = [], identity = '';
    const stop = () => { workers.forEach(w => w.terminate()); workers = []; };

    function fail(text) {
        stop();
        $('gw-err').textContent = text;
        $('gw-err').hidden = false;
        $('gw-skip').hidden = false;
    }

    $('gw-skip').onclick = async () => {
        await fetch('/api/guest/stamp', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify({ skip: true }) }).catch(() => {});
        location.reload();
    };

    // Average tries for this target: 2^256 / target (its top 52 bits are enough).
    function expected(targetHex) {
        const hex = targetHex.replace(/^0+/, '');
        const head = parseInt(hex.slice(0, 13), 16) || 1;
        return Math.pow(2, 256 - 4 * (hex.length - Math.min(13, hex.length))) / head;
    }

    async function send(stamp) {
        stop();
        $('gw-info').textContent = 'Found, checking...';
        $('gw-logo').classList.add('done');
        const r = await fetch('/api/guest/stamp', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify({ stamp }) });
        if (r.ok) { location.reload(); return; }
        $('gw-logo').classList.remove('done');
        start();     // not taken: search again
    }

    async function start() {
        let job;
        try { job = await (await fetch('/api/guest/identity', { cache: 'no-store' })).json(); }
        catch (e) { setTimeout(start, 3000); return; }
        if (!job || job.status !== 'success') { location.href = '/login'; return; }
        identity = job.identity_hash;
        $('gw-name').textContent = job.name;
        if (job.ready) { location.reload(); return; }
        if (typeof Worker === 'undefined') {
            fail('This browser cannot make the identity here. You can go on without the LXMF Messenger.');
            return;
        }
        const n = Math.max(1, Math.min(8, (navigator.hardwareConcurrency || 2) - 1));
        const avg = expected(job.target);
        let tries = 0;
        const t0 = Date.now();
        for (let i = 0; i < n; i++) {
            let w;
            try { w = new Worker('/script/stamper.js'); }
            catch (e) { fail('This browser cannot make the identity here. You can go on without the LXMF Messenger.'); return; }
            w.onmessage = ev => {
                const m = ev.data || {};
                if (m.stamp) { send(m.stamp); return; }
                tries += m.rounds || 0;
                // It is luck: the bar goes to 95% at the average and waits there.
                $('gw-bar').style.width = Math.min(95, 100 * tries / avg) + '%';
                const rate = tries / Math.max(0.1, (Date.now() - t0) / 1000);
                $('gw-info').textContent = `${(tries / 1e6).toFixed(1)} M tries, about ${Math.round(avg / 1e6)} M on average`
                    + ` (${(rate / 1e6).toFixed(1)} M/s on ${n} cores)`;
            };
            w.onerror = () => fail('The identity could not be made in this browser. You can go on without the LXMF Messenger.');
            w.postMessage({ material: job.material, target: job.target, size: job.size });
            workers.push(w);
        }
        $('gw-info').textContent = `Working on ${n} cores...`;
    }

    // The owner may close guest access meanwhile.
    setInterval(async () => {
        try {
            const st = await (await fetch('/api/guest/state', { cache: 'no-store' })).json();
            if (st.state === 'active') {
                if (st.identity && identity && st.identity !== identity) { stop(); location.reload(); }
                if (st.rights && !st.rights.messenger) { stop(); location.reload(); }
            } else if (['closed', 'changed', 'kicked', 'banned'].includes(st.state)) {
                stop(); location.href = '/login?ended=' + st.state;
            } else {
                stop(); location.href = '/login';
            }
        } catch (e) { /* restarting: next round */ }
    }, 5000);
    window.addEventListener('pagehide', () => { if (navigator.sendBeacon) navigator.sendBeacon('/api/guest/bye', ''); });
    start();
})();
</script></body></html>
